version: 2
updates:
  # Maven 依赖自动升级（每周日检查，PR 目标分支 dev）
  - package-ecosystem: maven
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: sunday
      time: '02:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - dependencies

  # GitHub Actions 依赖自动升级（每周日检查，PR 目标分支 dev）
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: sunday
      time: '02:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - dependencies
